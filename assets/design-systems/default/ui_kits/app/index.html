<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Design Slim App UI Kit</title>
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--od-bg);
        color: var(--od-text);
        font-family: var(--od-font-body);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
      }

      aside {
        border-right: 1px solid var(--od-border);
        background: var(--od-surface);
        padding: 22px 16px;
      }

      main {
        padding: 28px;
      }

      .brand {
        font-weight: 800;
      }

      nav {
        display: grid;
        gap: 6px;
        margin-top: 24px;
      }

      nav a {
        border-radius: var(--od-radius-control);
        color: var(--od-text-muted);
        padding: 10px 12px;
        text-decoration: none;
      }

      nav a[aria-current="page"] {
        background: var(--od-surface-muted);
        color: var(--od-text);
        font-weight: 700;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .panel {
        border: 1px solid var(--od-border);
        border-radius: var(--od-radius-panel);
        background: var(--od-surface);
        box-shadow: var(--od-shadow-panel);
        padding: 16px;
        min-height: 150px;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--od-border);
        border-radius: var(--od-radius-control);
        background: var(--od-surface);
        color: var(--od-text);
        padding: 0 14px;
        font: inherit;
      }

      button.primary {
        background: var(--od-accent);
        border-color: var(--od-accent);
        color: #fff;
      }

      @media (max-width: 820px) {
        .shell {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--od-border);
        }

        nav {
          grid-auto-flow: column;
          grid-auto-columns: max-content;
          overflow-x: auto;
        }

        header,
        .grid {
          grid-template-columns: 1fr;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">Slim App Kit</div>
        <nav aria-label="App sections">
          <a href="#" aria-current="page">Overview</a>
          <a href="#">Queue</a>
          <a href="#">Reports</a>
          <a href="#">Settings</a>
        </nav>
      </aside>
      <main>
        <header>
          <div>
            <h1>Operational app shell</h1>
            <p>Use this as a structure reference for dense prototype surfaces.</p>
          </div>
          <button class="primary">Primary action</button>
        </header>
        <section class="grid">
          <article class="panel"><strong>Panel</strong><p>Stable, bordered content area.</p></article>
          <article class="panel"><strong>State</strong><p>Include empty, loading, and error states.</p></article>
          <article class="panel"><strong>Action</strong><p>Controls stay compact and accessible.</p></article>
        </section>
      </main>
    </div>
  </body>
</html>
