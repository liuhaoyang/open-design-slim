name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Verify package contents
        run: pnpm pack --dry-run

      - name: Package skill bundle
        run: pnpm run release:skill

      - name: Upload skill bundle
        uses: actions/upload-artifact@v4
        with:
          name: open-design-slim-skill
          path: release/open-design-slim-skill.tar.gz
